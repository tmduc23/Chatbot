# Alembic giúp quản lý việc Database thay đổi cấu trúc theo thời gian

[alembic]

# Thư mục chứa các file migration
script_location = alembic
prepend_sys_path = .


# Khai báo các logger được cấu hình:
# root: logger gốc (mặc định)
# sqlalchemy: logger của SQLAlchemy (in các SQL query)
# alembic: logger của Alembic (in tiến trình migration)
[loggers]
keys = root,sqlalchemy,alembic


# Khai báo handler, nơi quyết định log sẽ được gửi đi đâu
# (console, file,...)
[handlers]
keys = console


# Khai báo formatter, formatter quyết định định dạng của log message
[formatters]
keys = generic


[logger_root]

# Chỉ từ WARNING trở lên: WARNING, ERROR, CRITICAL
level = WARNING

# In ra console rồi xuất hiện trên terminal
handlers = console


[logger_sqlalchemy]

# Chỉ in các query quan trọng
level = WARNING

# Không sử dụng handler riêng, kế thừa xử lý từ logger khác
handlers =

# Áp dụng logger của SQLAlchemy
# Dùng để theo dõi log từ SQLAlchemy Engine
qualname = sqlalchemy.engine


[logger_alembic]

# Hiển thị log từ mức INFO trở lên
level = INFO

# Gửi log tới handler console
handlers = console

# Áp dụng cho logger của Alembic
qualname = alembic


[handler_console]

# Gửi log ra stream
class = StreamHandler

# Gửi log tới stderr, thường hiển thị trên terminal
args = (sys.stderr,)

# Không lọc thêm ở handler, để logger quyết định mức log
level = NOTSET

# Sử dụng formatter generic
formatter = generic


[formatter_generic]

# Định dạng log:
# %(levelname)-5.5s = tên mức log, độ rộng tối đa 5 ký tự
# %(name)s           = tên logger
# %(message)s        = nội dung log
format = %(levelname)-5.5s [%(name)s] %(message)s