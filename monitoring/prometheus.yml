# Phase 12d: Prometheus hỏi backend mỗi 15 giây, lưu lại thành chuỗi thời gian.
# Mở http://localhost:9090 -> tab Graph để vẽ, tab Alerts để xem cảnh báo.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rag-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]   # tên service trong docker-compose, không phải localhost
    # APP_ENV khác development thì /metrics cần token. Ghi token vào file monitoring/metrics_token
    # (đã có trong .gitignore), rồi bỏ comment 3 dòng dưới:
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics_token
