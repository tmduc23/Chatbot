services:
  postgres:
    build:  ./postgres
    image: rag-postgres:17
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata17:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    # Phase 13: Dockerfile chạy production (không --reload). Khi dev thì bật --reload ở đây
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./storage:/app/storage
      - ./eval:/app/eval
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Phase 12a: tiến trình xử lý tài liệu nền. Cùng image với backend, chỉ khác lệnh chạy.
  worker:
    build: ./backend
    env_file: .env
    command: python scripts/worker.py
    volumes:
      - ./backend/app:/app/app
      - ./scripts:/app/scripts
      - ./storage:/app/storage      # PHẢI dùng chung storage với backend: worker đọc file backend đã lưu
    depends_on:
      backend:
        condition: service_healthy  # backend chạy "alembic upgrade head" lúc khởi động -> chờ migration xong
    restart: unless-stopped         # worker chết (lỗi lạ, hết RAM) -> Docker tự bật lại
    stop_grace_period: 2m           # docker stop: chờ worker làm xong document đang dở rồi mới kill

  # Phase 12d: Prometheus đọc /metrics của backend. Chỉ chạy khi bật profile:
  #   docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9090:9090"       # chỉ máy bạn mở được, không lộ ra mạng LAN
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    depends_on:
      - backend
    

  frontend:
    build:
      context: ./frontend
      args:
        # địa chỉ backend mà TRÌNH DUYỆT gọi; đổi BACKEND_PORT thì đổi cả dòng này
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pgdata17:
  promdata:
